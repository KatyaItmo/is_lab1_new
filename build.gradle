plugins {
    id 'java'
    id 'war'
}

group = 'org.itmo.is'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'org.eclipse.persistence:eclipselink:3.0.4'
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    compileOnly 'jakarta.enterprise:jakarta.enterprise.cdi-api:4.0.1'

    compileOnly 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'

    compileOnly 'jakarta.validation:jakarta.validation-api:3.0.2'

    compileOnly 'jakarta.transaction:jakarta.transaction-api:2.0.1'

    compileOnly 'jakarta.websocket:jakarta.websocket-api:2.1.1'
    compileOnly 'jakarta.websocket:jakarta.websocket-client-api:2.1.1'

    implementation 'org.postgresql:postgresql:42.7.2'
}

test {
    useJUnitPlatform()
}

war {
    archiveFileName = 'app.war'
}